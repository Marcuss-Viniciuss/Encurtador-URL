services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/shortener.db
      BASE_URL: http://localhost:8000
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - db_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  # Para escalar para PostgreSQL: descomente este serviço e troque DATABASE_URL do backend para
  # postgresql+psycopg://shortener:shortener@db:5432/shortener (e adicione "db" no depends_on).
  # db:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_USER: shortener
  #     POSTGRES_PASSWORD: shortener
  #     POSTGRES_DB: shortener
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data

volumes:
  db_data:
  # pg_data:
